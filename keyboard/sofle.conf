# Sofle config. Applies to both halves: ZMK resolves `<shield>.conf` by the
# shield's base name, so this one file covers sofle_left and sofle_right.

# --- Encoders -------------------------------------------------------------
# Both encoders confirmed present on this board. The stock shield ships these
# commented out, so without these two lines the knobs are inert and the
# `sensor-bindings` in the keymap are silently dead.
CONFIG_EC11=y
CONFIG_EC11_TRIGGER_GLOBAL_THREAD=y

# --- OLED -----------------------------------------------------------------
# Sofle ships with OLEDs. Harmless if a half has none (the i2c probe just
# fails and the display layer stays dark) — comment it out to claw back the
# battery it costs, which is not nothing on a wireless build.
#
# WHAT EACH HALF CAN ACTUALLY SHOW is decided by ZMK, not by taste. Every
# interesting widget is gated on being the CENTRAL side of the split
# (app/src/display/widgets/Kconfig: `depends on ZMK_SPLIT_ROLE_CENTRAL`),
# because a peripheral never runs the keymap and so does not know the layer,
# the output, or the WPM. Left is central here, so:
#
#   LEFT  (central)     layer name, battery, output (USB/BLE), WPM
#   RIGHT (peripheral)  battery, split-connection icon. That is the lot.
#
# Which is why the right half is worth giving a logo instead: there is
# nothing else it is allowed to say.
#
# The layer NAME comes from `display-name` on each layer in sofle.keymap
# (already set: base/nav/media/adj). Keep those <= 9 characters -- the widget
# formats into a `char text[14]` after a 3-byte LVGL keyboard glyph and a
# space, so anything longer is silently truncated by snprintf.
CONFIG_ZMK_DISPLAY=y

# Built-in screen widgets. LAYER/BATTERY/OUTPUT/PERIPHERAL are already
# implied by ZMK_DISPLAY_STATUS_SCREEN_BUILT_IN; these two are not, and are
# left here as the menu rather than turned on, because both cost pixels on a
# 128x32 panel and that is a look-at-it decision.
# CONFIG_ZMK_WIDGET_BATTERY_STATUS_SHOW_PERCENTAGE=y   # "42%" instead of an icon
# CONFIG_ZMK_WIDGET_WPM_STATUS=y                       # words per minute, central only

# The OLED blanks itself after this long idle and comes back on the next
# keypress (CONFIG_ZMK_DISPLAY_BLANK_ON_IDLE defaults y for SSD1306). 30s is
# ZMK's default and is quite eager if you want to glance at the layer.
# CONFIG_ZMK_IDLE_TIMEOUT=60000

# --- Power ----------------------------------------------------------------
# Deep sleep after 15 min idle. Wakes on the first keypress.
CONFIG_ZMK_SLEEP=y
CONFIG_ZMK_IDLE_SLEEP_TIMEOUT=900000

# --- Per-key RGB ------------------------------------------------------------
# The Sofle's per-key LEDs are SK6812MINI-E: addressable, WS2812-protocol
# parts. ZMK drives them with the *underglow* subsystem, not the *backlight*
# one -- "backlight" in ZMK means a single-colour array that cannot dim
# individual LEDs, which is not what this board has. So this is the right
# switch even though nothing here glows from underneath.
#
# Keep this and the `&rgb_ug` bindings in sofle.keymap together: the driver is
# only compiled when this is set, so the keys are dead weight without it.
CONFIG_ZMK_RGB_UNDERGLOW=y

# BATTERY. This is the whole story for a wireless board. 29 RGB LEDs per half
# at full white is roughly 29 x 60mA = 1.7A, which a 1000mAh cell turns into
# well under an hour -- and that is before the regulator complains. A single
# mid-brightness hue is nearer 200-350mA, so think hours, against the weeks
# this board gets with the LEDs off.
#
# Hence: start OFF and let the user opt in per session, cap the maximum so a
# held brightness key cannot reach the ugly end of that range, and drop the
# LEDs when the board goes idle.
CONFIG_ZMK_RGB_UNDERGLOW_ON_START=n
CONFIG_ZMK_RGB_UNDERGLOW_BRT_START=30
CONFIG_ZMK_RGB_UNDERGLOW_BRT_MAX=50
CONFIG_ZMK_RGB_UNDERGLOW_AUTO_OFF_IDLE=y

# Set this to y for "LEDs only while plugged in" -- the single biggest battery
# win if you decide the lights are a desk luxury rather than a portable one.
# CONFIG_ZMK_RGB_UNDERGLOW_AUTO_OFF_USB=y

# THIS MUST STAY `n` IF YOU WANT THE OLEDs. At `y`, the underglow driver
# toggles the nice!nano's external power rail (P0.13) alongside the LEDs --
# and that rail is what feeds the OLED, so the display dies with the lights.
# With AUTO_OFF_IDLE above that is not a trade, it is a deterministic bug:
#
#   boot            ext power on (ext_power_generic_init enables it), OLED lit
#   +30s idle       activity goes IDLE -> rgb_underglow_auto_state(false) ->
#                   zmk_rgb_underglow_off() -> ext_power_disable(). OLED dark.
#   next keypress   wake -> auto_state(true). It restores the state the LEDs
#                   had BEFORE idling -- which is off, since ON_START=n -- so
#                   it calls off() AGAIN. Ext power is never re-enabled.
#
# Net effect: the OLEDs die 30 seconds after every boot and do not come back.
# (ZMK also has a standing bug where a display does not recover from an
# ext-power cutoff at all: zmkfirmware/zmk#674, which is why the docs still
# call displays a proof of concept.)
#
# The cost of `n` is real and it is the LED strip's QUIESCENT draw: the rail
# now stays powered, so 29 SK6812MINI-E per half sit there idling even with
# every pixel set to 0. Call it 10-30mA a half, which turns the LEDs-off
# battery life from weeks into a couple of days. There is no third option --
# the OLED and the LED strip share one rail, so you cannot power one without
# the other. Weeks of battery or a working display: pick one, here.
#
# AUTO_OFF_IDLE above still does its job at `n`; it just blanks the pixels
# instead of cutting the rail.
CONFIG_ZMK_RGB_UNDERGLOW_EXT_POWER=n

# --- ZMK Studio -----------------------------------------------------------
# Studio locks itself after 500s idle and on every disconnect, and a locked
# device silently refuses edits. Keep the defaults: the lock is the only
# thing standing between a stray USB connection and your keymap.
# CONFIG_ZMK_STUDIO_LOCK_ON_DISCONNECT=n
